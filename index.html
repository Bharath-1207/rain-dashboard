<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pondy &amp; Auroville rain network</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=JetBrains+Mono:wght@600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<style>
:root{--bg:#0f1420;--card:#151b2b;--line:#232c42;--tx:#f3f5fa;--mut:#8b94ab;--hd:#6b9cff;--rr:#3a63e6;--nem:#a35cf0;--cyan:#38bdf8}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:Outfit,system-ui,sans-serif;padding:20px;max-width:1280px;margin-inline:auto}
header{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center;margin-bottom:18px}
h1{font-size:22px;margin:0}.sub{color:var(--mut);font-size:13px}
.tabs{display:flex;flex-wrap:wrap;gap:6px}.tabs button{background:var(--card);color:var(--mut);border:1px solid var(--line);padding:8px 14px;border-radius:8px;font:600 14px Outfit;cursor:pointer;transition:all .2s}
.tabs button.on{color:var(--tx);border-color:var(--hd);background:#1a2338}button:focus-visible{outline:2px solid var(--hd)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
.card h2{font-size:16px;color:var(--hd);margin:0 0 2px;font-weight:700}.id{font-size:12px;color:var(--mut)}
.card-head{display:flex;justify-content:space-between;align-items:flex-start}
.top{margin:10px 0 6px}
.big{font-size:48px;font-weight:600;line-height:1}.u{font-size:15px;color:var(--mut);margin-left:4px}
.rr{text-align:right}.rr b{font-size:22px;color:var(--rr)}.rr.wet b{color:#4fd1ff}
.sub-row{display:flex;justify-content:space-between;background:#0c111c;border:1px solid var(--line);border-radius:8px;padding:6px 10px;margin:10px 0 10px;font-size:11px;color:var(--mut)}
.sub-row b{color:var(--tx);font-size:12px;margin-left:4px}
.nem-section{border-top:1px solid var(--line);padding-top:10px;margin-top:10px}
.nem-head{display:flex;justify-content:space-between;align-items:center;font-size:11px;font-weight:700;color:var(--hd);text-transform:uppercase;letter-spacing:.8px;margin-bottom:6px}
.nem-active-tag{color:#38bdf8;font-size:10px;background:rgba(56,189,248,0.12);padding:2px 6px;border-radius:4px;border:1px solid rgba(56,189,248,0.3)}
.nem-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.nem-cell{background:#0c111c;border:1px solid var(--line);border-radius:8px;padding:7px 4px;text-align:center;transition:all .2s}
.nem-cell.cur-m{border-color:rgba(56,189,248,0.45);background:rgba(56,189,248,0.08);box-shadow:0 0 8px rgba(56,189,248,0.15)}
.nem-cell small{display:block;color:var(--mut);font-size:10px;font-weight:700;text-transform:uppercase;margin-bottom:3px;letter-spacing:.4px}
.nem-cell b{font-size:14px;color:var(--tx);font-weight:700;font-family:'Outfit',sans-serif}
.nem-cell.cur-m b{color:#38bdf8}
.nem-cell .unit{font-size:10px;color:var(--mut);font-weight:500;margin-left:2px}
.totals-row{display:grid;grid-template-columns:1.15fr 0.85fr;gap:8px;border-top:1px dashed var(--line);padding-top:10px;margin-top:10px;text-align:center}
.totals-row small{display:block;color:var(--mut);font-size:11px;margin-bottom:2px}
.tot-nem{font-size:16px;color:#c084fc;font-weight:800}
.tot-yr{font-size:16px;color:#f3f5fa;font-weight:700}
.stale{color:#e0a458;font-size:12px}.err{color:#ff7a7a;font-size:13px}
#chartbox{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;height:min(70vh,520px)}
.hide{display:none}
.btn-ref{background:var(--card);color:var(--hd);border:1px solid var(--line);padding:8px 12px;border-radius:8px;font:600 13px Outfit;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:all .2s}
.btn-ref:hover{background:var(--line);border-color:var(--hd)}
.btn-ref.spin{opacity:.7;pointer-events:none}
.live-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#5ce0a0;margin-right:6px;box-shadow:0 0 8px #5ce0a0}

/* Top 24h Rainfall Chart Box */
#topchartbox{display:flex;flex-direction:column;gap:14px}
.chart-toolbar{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 18px;gap:12px}
.chart-toolbar-left{display:flex;align-items:center;gap:10px}
.chart-pill{background:rgba(56,189,248,0.15);border:1px solid rgba(56,189,248,0.4);color:var(--cyan);font-size:12px;font-weight:700;padding:4px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:1px}
.chart-toolbar-right{display:flex;gap:8px}
.btn-action{background:linear-gradient(135deg,#1e293b,#0f172a);color:#fff;border:1px solid var(--cyan);padding:8px 16px;border-radius:8px;font:700 13px Outfit;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:all .2s;box-shadow:0 2px 8px rgba(56,189,248,0.2)}
.btn-action:hover{background:var(--cyan);color:#0f172a;box-shadow:0 4px 14px rgba(56,189,248,0.4)}
.btn-action.copied{background:#10b981;border-color:#10b981;color:#fff}

/* Shareable Card Preview Container */
.infocard{background:linear-gradient(145deg,#111827 0%,#0d1424 100%);border:1.5px solid #24324f;border-radius:20px;padding:28px 32px;box-shadow:0 20px 40px rgba(0,0,0,0.5),0 0 30px rgba(56,189,248,0.1);max-width:960px;margin-inline:auto}
.infocard-header{margin-bottom:20px}
.infocard-tag{display:inline-flex;align-items:center;gap:6px;background:rgba(56,189,248,0.15);border:1px solid rgba(56,189,248,0.4);color:var(--cyan);font-size:12px;font-weight:700;padding:4px 12px;border-radius:20px;text-transform:uppercase;letter-spacing:1px;margin-bottom:10px}
.infocard-title{font-size:24px;font-weight:800;color:#fff;margin:0 0 6px;line-height:1.25}
.infocard-sub{font-size:14px;color:var(--mut)}
.infocard-sub b{color:var(--cyan)}
.infocard-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;background:rgba(15,23,42,0.7);border:1px solid #1e293b;border-radius:12px;padding:12px 18px;margin-bottom:20px}
.stat-item small{display:block;font-size:11px;color:#64748b;text-transform:uppercase;font-weight:700;letter-spacing:.8px}
.stat-item b{font-size:17px;color:#f8fafc}
.stat-item b span{color:var(--cyan)}

.inforow-list{display:flex;flex-direction:column;gap:8px}
.inforow{display:flex;align-items:center;gap:14px;background:rgba(17,24,39,0.6);border:1px solid #1f293d;padding:10px 16px;border-radius:12px;transition:all .2s}
.inforow.top-1{background:rgba(30,41,59,0.7);border-color:rgba(56,189,248,0.4);box-shadow:0 0 16px rgba(56,189,248,0.1)}
.inforow-badge{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;font-family:'JetBrains Mono',monospace;flex-shrink:0}
.badge-1{background:linear-gradient(135deg,#fbbf24,#d97706);color:#000;box-shadow:0 0 10px rgba(251,191,36,0.5)}
.badge-2{background:linear-gradient(135deg,#e2e8f0,#94a3b8);color:#000}
.badge-3{background:linear-gradient(135deg,#f59e0b,#b45309);color:#fff}
.badge-other{background:#1e293b;color:#94a3b8;border:1px solid #334155}
.inforow-main{flex:1;min-width:0}
.inforow-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.inforow-name{font-size:15px;font-weight:700;color:#f8fafc}
.inforow-id{font-family:'JetBrains Mono',monospace;font-size:11px;color:#64748b;font-weight:600}
.inforow-bar{width:100%;height:8px;background:#1e293b;border-radius:6px;overflow:hidden}
.inforow-fill{height:100%;border-radius:6px}
.inforow-val{font-family:'JetBrains Mono',monospace;font-size:20px;font-weight:800;color:var(--cyan);text-align:right;min-width:90px;flex-shrink:0}
.inforow.top-1 .inforow-val{color:#00f0ff;font-size:22px;text-shadow:0 0 10px rgba(0,240,255,0.4)}
.inforow-val small{font-size:12px;color:var(--mut);font-weight:600;margin-left:3px}

.infocard-foot{display:flex;justify-content:space-between;align-items:center;border-top:1px solid #1e293b;padding-top:14px;margin-top:16px;font-size:12px;color:#64748b}
.infocard-foot b{color:#94a3b8}

@media(max-width:600px){
  .infocard{padding:18px 14px}
  .infocard-title{font-size:18px}
  .inforow{padding:8px 10px;gap:10px}
  .inforow-val{font-size:17px;min-width:70px}
  .inforow-name{font-size:13px}
  .inforow-badge{width:26px;height:26px;font-size:11px}
}
</style></head><body>
<header><div><h1>Pondy &amp; Auroville rain network</h1>
<div class="sub" id="meta"><span class="live-dot"></span>Loading live data…</div></div>
<div class="tabs">
  <button id="btn-ref" class="btn-ref" title="Fetch latest live PWS data now">↻ Refresh</button>
  <button id="t1" class="on">Stations</button>
  <button id="t2">🏆 24h Top Rainfall</button>
  <button id="t3">📈 Cumulative Trend</button>
</div></header>

<div class="grid" id="grid"></div>

<!-- 24h Top Rainfall Chart view -->
<div id="topchartbox" class="hide">
  <div class="chart-toolbar">
    <div class="chart-toolbar-left">
      <span class="chart-pill">🌧️ Group Shareable Card</span>
      <span class="sub">High-resolution graphic for WhatsApp &amp; weather groups</span>
    </div>
    <div class="chart-toolbar-right">
      <button id="btn-dl" class="btn-action" title="Download image to your phone or computer">📥 Download Image</button>
      <button id="btn-copy" class="btn-action" title="Copy image to clipboard to paste directly in WhatsApp">📋 Copy Image</button>
    </div>
  </div>
  <div id="card-preview-wrap"></div>
  <canvas id="exportCanvas" width="1200" height="1020" style="display:none;"></canvas>
</div>

<!-- 48-slot line chart view -->
<div id="chartbox" class="hide"><canvas id="cv"></canvas></div>

<script>
const $=id=>document.getElementById(id);let chart,data,loading=false;
const pal=['#6b9cff','#4fd1ff','#a35cf0','#ff8a5c','#5ce0a0','#ffd25c','#ff5c8a','#c0c8dc'];
const fmt=t=>new Date(t*1000).toLocaleString('en-IN',{timeZone:'Asia/Kolkata',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit',second:'2-digit'});

function roundRect(ctx,x,y,w,h,r,fill,stroke){
  ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);
  ctx.quadraticCurveTo(x+w,y,x+w,y+r);ctx.lineTo(x+w,y+h-r);
  ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);
  ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);
  ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();
  if(fill)ctx.fill();if(stroke)ctx.stroke();
}

function drawExportCanvas(sorted, topStation, avgVal, rainDate){
  const cv=$('exportCanvas');const ctx=cv.getContext('2d');
  const w=1200,h=1020;cv.width=w;cv.height=h;

  const bgGrad=ctx.createLinearGradient(0,0,w,h);
  bgGrad.addColorStop(0,'#090e1a');bgGrad.addColorStop(1,'#0f172a');
  ctx.fillStyle=bgGrad;ctx.fillRect(0,0,w,h);

  ctx.save();
  ctx.fillStyle='#111827';ctx.strokeStyle='#24324f';ctx.lineWidth=2;
  roundRect(ctx,30,30,w-60,h-60,24,true,true);

  const glow=ctx.createRadialGradient(w-100,100,10,w-100,100,350);
  glow.addColorStop(0,'rgba(56,189,248,0.18)');glow.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=glow;ctx.fillRect(30,30,w-60,h-60);

  // Pill
  ctx.fillStyle='rgba(56,189,248,0.15)';ctx.strokeStyle='rgba(56,189,248,0.4)';ctx.lineWidth=1.5;
  roundRect(ctx,70,65,260,32,16,true,true);
  ctx.fillStyle='#38bdf8';ctx.font='700 13px Outfit,sans-serif';
  ctx.fillText('🌧️  24-HOUR RAINFALL BULLETIN',82,86);

  ctx.fillStyle='#94a3b8';ctx.font='500 14px Outfit,sans-serif';
  ctx.fillText('Standard IMD Rain Day Window (08:30 IST → 08:30 IST)',350,86);

  // Title
  ctx.fillStyle='#ffffff';ctx.font='800 32px Outfit,sans-serif';
  ctx.fillText('Private Weather Station Rainfall across Puducherry and Auroville',70,135);

  // Subtitle
  ctx.fillStyle='#94a3b8';ctx.font='500 17px Outfit,sans-serif';
  ctx.fillText('Rain recorded for the 24 hours ended at ',70,170);
  const subW=ctx.measureText('Rain recorded for the 24 hours ended at ').width;
  ctx.fillStyle='#38bdf8';ctx.font='700 17px Outfit,sans-serif';
  ctx.fillText('08:30 AM IST, '+rainDate,70+subW,170);

  // Stats
  const statBoxY=195;const boxW=330;
  const statBoxes=[
    {label:'HIGHEST RAINFALL',val:topStation.name+' · ',hl:topStation.val.toFixed(1)+' mm'},
    {label:'NETWORK AVERAGE',val:avgVal+' mm',hl:''},
    {label:'STATIONS REPORTING',val:sorted.length+' Active Stations',hl:''}
  ];
  statBoxes.forEach((b,i)=>{
    const bx=70+i*(boxW+35);
    ctx.fillStyle='rgba(15,23,42,0.7)';ctx.strokeStyle='#1e293b';ctx.lineWidth=1;
    roundRect(ctx,bx,statBoxY,boxW,64,12,true,true);
    ctx.fillStyle='#64748b';ctx.font='700 11px Outfit,sans-serif';
    ctx.fillText(b.label,bx+16,statBoxY+22);
    ctx.fillStyle='#f8fafc';ctx.font='700 17px Outfit,sans-serif';
    ctx.fillText(b.val,bx+16,statBoxY+48);
    if(b.hl){
      const vw=ctx.measureText(b.val).width;
      ctx.fillStyle='#38bdf8';ctx.fillText(b.hl,bx+16+vw,statBoxY+48);
    }
  });

  // Rows
  const maxV=Math.max(...sorted.map(s=>s.val),10);
  const rowStartY=280;const rowH=68;const rowSpacing=76;
  sorted.forEach((s,idx)=>{
    const ry=rowStartY+idx*rowSpacing;const rank=idx+1;const isFirst=rank===1;
    ctx.fillStyle=isFirst?'rgba(30,41,59,0.7)':'rgba(17,24,39,0.6)';
    ctx.strokeStyle=isFirst?'rgba(56,189,248,0.4)':'#1f293d';ctx.lineWidth=1.2;
    roundRect(ctx,70,ry,1060,rowH,14,true,true);

    const cx=104,cy=ry+34,cr=17;
    ctx.beginPath();ctx.arc(cx,cy,cr,0,Math.PI*2);
    ctx.fillStyle=rank===1?'#fbbf24':rank===2?'#cbd5e1':rank===3?'#d97706':'#1e293b';
    ctx.fill();
    if(rank>3){ctx.strokeStyle='#334155';ctx.stroke()}

    ctx.fillStyle=rank<=2?'#000000':'#ffffff';
    ctx.font='700 13px "JetBrains Mono",monospace';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(String(rank),cx,cy);ctx.textAlign='left';ctx.textBaseline='alphabetic';

    const medal=rank===1?' 🥇':rank===2?' 🥈':rank===3?' 🥉':'';
    ctx.fillStyle='#ffffff';ctx.font='700 17px Outfit,sans-serif';
    ctx.fillText(s.name+medal,140,ry+28);

    ctx.fillStyle='#64748b';ctx.font='600 12px "JetBrains Mono",monospace';
    ctx.fillText(s.id,860,ry+28);

    const barX=140,barY=ry+40,barW=790,barH=10;
    ctx.fillStyle='#1e293b';roundRect(ctx,barX,barY,barW,barH,5,true,false);

    const fillW=Math.max(8,(s.val/maxV)*barW);
    const barGrad=ctx.createLinearGradient(barX,0,barX+fillW,0);
    if(rank===1){barGrad.addColorStop(0,'#38bdf8');barGrad.addColorStop(0.5,'#00f0ff');barGrad.addColorStop(1,'#818cf8')}
    else if(rank===2){barGrad.addColorStop(0,'#60a5fa');barGrad.addColorStop(1,'#38bdf8')}
    else if(rank===3){barGrad.addColorStop(0,'#a78bfa');barGrad.addColorStop(1,'#818cf8')}
    else if(s.val===0){barGrad.addColorStop(0,'#334155');barGrad.addColorStop(1,'#334155')}
    else{barGrad.addColorStop(0,'#38bdf8');barGrad.addColorStop(1,'#6366f1')}
    ctx.fillStyle=barGrad;roundRect(ctx,barX,barY,fillW,barH,5,true,false);

    ctx.textAlign='right';
    ctx.font='800 24px "JetBrains Mono",monospace';
    ctx.fillStyle=isFirst?'#00f0ff':'#38bdf8';
    ctx.fillText(s.val.toFixed(1),1080,ry+40);
    ctx.font='600 13px Outfit,sans-serif';ctx.fillStyle='#94a3b8';
    ctx.fillText('mm',1110,ry+40);ctx.textAlign='left';
  });

  const footY=945;ctx.strokeStyle='#1e293b';ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(70,footY);ctx.lineTo(1130,footY);ctx.stroke();

  ctx.fillStyle='#64748b';ctx.font='500 13px Outfit,sans-serif';
  ctx.fillText('Puducherry & Auroville Weather Network · Standard IMD Rain Day Window (08:30 IST → 08:30 IST)',70,footY+28);

  ctx.fillStyle='#34d399';ctx.font='700 13px Outfit,sans-serif';ctx.textAlign='right';
  ctx.fillText('● Verified Automated Station Network',1130,footY+28);ctx.textAlign='left';
  ctx.restore();
}

function render(){
  const startD = data.rainDayStartDate || data.todayKey;
  const activeMonthStr = data.rainDayMonth || (data.rainDayEndDate || '').slice(0, 7) || (startD || '').slice(0, 7);
  const curM = activeMonthStr.slice(5, 7);
  const curMonthName = curM === '11' ? 'November' : (curM === '12' ? 'December' : 'October');
  $('meta').innerHTML=`<span class="live-dot"></span>Rain Day: <b>${startD}</b> (8:30 am IST → next day 8:30 am IST) · updated <b>${fmt(data.updated)} IST</b> <span class="sub" style="font-size:11px">· live auto-update 30s</span>`;
  
  // 1. Grid of Stations
  $('grid').innerHTML=data.stations.map(s=>s.error?`<div class="card"><h2>${s.name}</h2><div class="err">Could not load: ${s.error}</div></div>`:
  `<div class="card">
    <div class="card-head">
      <div>
        <h2>${s.name}</h2>
        <div class="id">${s.id}${s.ageMin>45?` · <span class="stale">last report ${s.ageMin} min ago</span>`:s.ageMin<=2?` · <span style="color:#5ce0a0">live</span>`:''}</div>
      </div>
      <div class="rr ${s.rate>0?'wet':''}"><small class="sub">Rain rate</small><br><b>${s.rate}</b><span class="u">mm/h</span></div>
    </div>
    <div class="top">
      <div><span class="big">${s.today}</span><span class="u">mm</span></div>
      <div class="sub" style="font-size:11px;color:var(--hd);font-weight:600">Since 8:30 am today</div>
    </div>
    <div class="sub-row">
      <div><span>Yesterday (ended 8:30am):</span> <b>${s.prevDay != null ? s.prevDay : '-'} mm</b></div>
      <div><span>Calendar day:</span> <b>${s.calDay != null ? s.calDay : '-'} mm</b></div>
    </div>
    <div class="nem-section">
      <div class="nem-head">
        <span>NEM Rainfall (Oct–Dec)</span>
        <span class="nem-active-tag">${curMonthName} Active</span>
      </div>
      <div class="nem-grid">
        <div class="nem-cell ${curM==='10'?'cur-m':''}">
          <small>Oct</small>
          <b>${s.oct != null ? s.oct : s.month}<span class="unit">mm</span></b>
        </div>
        <div class="nem-cell ${curM==='11'?'cur-m':''}">
          <small>Nov</small>
          <b>${s.nov != null ? s.nov : '0.0'}<span class="unit">mm</span></b>
        </div>
        <div class="nem-cell ${curM==='12'?'cur-m':''}">
          <small>Dec</small>
          <b>${s.dec != null ? s.dec : '0.0'}<span class="unit">mm</span></b>
        </div>
      </div>
    </div>
    <div class="totals-row">
      <div><small>NEM Season Total</small><b class="tot-nem">${s.nem} mm</b></div>
      <div><small>Yearly (2026)</small><b class="tot-yr">${s.year} mm</b></div>
    </div>
  </div>`).join('');

  // 2. Top 24h Rainfall Infographic Card
  const sorted = [...data.stations]
    .filter(s=>!s.error)
    .map(s=>({name:s.name, id:s.id, val:s.prevDay!=null?parseFloat(s.prevDay):0}))
    .sort((a,b)=>b.val - a.val);

  const maxVal = Math.max(...sorted.map(s=>s.val), 10);
  const totalVal = sorted.reduce((sum,s)=>sum+s.val,0);
  const avgVal = (totalVal/sorted.length).toFixed(1);
  const topStation = sorted[0] || { name:'-', val:0 };

  const rowsHtml = sorted.map((s, idx) => {
    const rank = idx + 1;
    const pct = Math.max(3, Math.round((s.val / maxVal) * 100));
    const badgeClass = rank===1?'badge-1':rank===2?'badge-2':rank===3?'badge-3':'badge-other';
    const medal = rank===1?'🥇':rank===2?'🥈':rank===3?'🥉':'';
    let fillGrad = 'linear-gradient(90deg, #38bdf8, #6366f1)';
    if(rank===1) fillGrad = 'linear-gradient(90deg, #38bdf8, #00f0ff, #818cf8)';
    else if(rank===2) fillGrad = 'linear-gradient(90deg, #60a5fa, #38bdf8)';
    else if(rank===3) fillGrad = 'linear-gradient(90deg, #a78bfa, #818cf8)';
    else if(s.val===0) fillGrad = '#334155';

    return `
      <div class="inforow ${rank===1?'top-1':''}">
        <div class="inforow-badge ${badgeClass}">${rank}</div>
        <div class="inforow-main">
          <div class="inforow-top">
            <span class="inforow-name">${s.name} ${medal}</span>
            <span class="inforow-id">${s.id}</span>
          </div>
          <div class="inforow-bar">
            <div class="inforow-fill" style="width:${pct}%; background:${fillGrad}"></div>
          </div>
        </div>
        <div class="inforow-val">${s.val.toFixed(1)}<small>mm</small></div>
      </div>
    `;
  }).join('');

  $('card-preview-wrap').innerHTML = `
    <div class="infocard">
      <div class="infocard-header">
        <div class="infocard-tag">🌧️ 24-Hour Rainfall Bulletin</div>
        <h2 class="infocard-title">Private Weather Station Rainfall across Puducherry and Auroville</h2>
        <div class="infocard-sub">Rain recorded for the 24 hours ended at <b>08:30 AM IST, ${startD}</b></div>
      </div>
      <div class="infocard-stats">
        <div class="stat-item"><small>Highest Rainfall</small><b>${topStation.name} · <span>${topStation.val.toFixed(1)} mm</span></b></div>
        <div class="stat-item"><small>Network Average</small><b>${avgVal} mm</b></div>
        <div class="stat-item"><small>Stations Reporting</small><b>${sorted.length} Active Stations</b></div>
      </div>
      <div class="inforow-list">${rowsHtml}</div>
      <div class="infocard-foot">
        <div><b>Puducherry &amp; Auroville Weather Network</b> · Real-time PWS Data</div>
        <div style="color:#5ce0a0;font-weight:600">● Verified Automated Station Network</div>
      </div>
    </div>
  `;

  // Draw High-Res Export Canvas
  try {
    drawExportCanvas(sorted, topStation, avgVal, startD);
  } catch(e){}

  // 3. Line Chart
  const labels=Array.from({length:48},(_,i)=>{const m=510+30*(i+1);return String(Math.floor(m/60)%24).padStart(2,'0')+':'+String(m%60).padStart(2,'0')});
  const ds=data.stations.filter(s=>!s.error).map((s,i)=>({label:s.name,data:s.series,borderColor:pal[i%8],backgroundColor:pal[i%8],tension:.25,pointRadius:0,borderWidth:2}));
  if(chart)chart.destroy();
  chart=new Chart($('cv'),{type:'line',data:{labels,datasets:ds},options:{maintainAspectRatio:false,interaction:{mode:'index',intersect:false},
   plugins:{legend:{labels:{color:'#c0c8dc'}},title:{display:true,text:'Cumulative rainfall since 8:30 am (mm)',color:'#c0c8dc'}},
   scales:{x:{ticks:{color:'#8b94ab',maxTicksLimit:12},grid:{color:'#232c42'}},y:{beginAtZero:true,title:{display:true,text:'mm',color:'#8b94ab'},ticks:{color:'#8b94ab'},grid:{color:'#232c42'}}}}});
}

async function load(){
  if(loading)return;loading=true;
  $('btn-ref').classList.add('spin');
  $('btn-ref').textContent='Updating…';
  try{
    data=await (await fetch('/api/rain?t='+Date.now())).json();
    render();
  }catch(e){
    $('meta').textContent='Could not load data. Retrying…';
  }finally{
    loading=false;
    $('btn-ref').classList.remove('spin');
    $('btn-ref').textContent='↻ Refresh';
  }
}

function tab(n){
  $('grid').classList.toggle('hide',n!==1);
  $('topchartbox').classList.toggle('hide',n!==2);
  $('chartbox').classList.toggle('hide',n!==3);
  $('t1').classList.toggle('on',n===1);
  $('t2').classList.toggle('on',n===2);
  $('t3').classList.toggle('on',n===3);
  if(n===3 && chart) chart.resize();
}

$('t1').onclick=()=>tab(1);
$('t2').onclick=()=>tab(2);
$('t3').onclick=()=>tab(3);
$('btn-ref').onclick=()=>load();

// Download Image Button
$('btn-dl').onclick=()=>{
  const cv=$('exportCanvas');
  const dStr=(data?.rainDayStartDate||'24h').replace(/[^0-9a-zA-Z-]/g,'');
  const link=document.createElement('a');
  link.download=`PWS-Rainfall-24h-${dStr}.png`;
  link.href=cv.toDataURL('image/png');
  link.click();
};

// Copy Image Button
$('btn-copy').onclick=async()=>{
  const btn=$('btn-copy');
  const orig=btn.textContent;
  try{
    const cv=$('exportCanvas');
    cv.toBlob(async blob=>{
      try{
        await navigator.clipboard.write([new ClipboardItem({'image/png':blob})]);
        btn.textContent='✓ Copied to Clipboard!';
        btn.classList.add('copied');
        setTimeout(()=>{btn.textContent=orig;btn.classList.remove('copied')},2500);
      }catch(err){
        btn.textContent='Image download ready';
        $('btn-dl').click();
        setTimeout(()=>{btn.textContent=orig},2000);
      }
    });
  }catch(e){
    $('btn-dl').click();
  }
};

window.addEventListener('focus',()=>load());
load();setInterval(load,30000);
</script></body></html>
